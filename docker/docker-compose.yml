services:
  collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector}
    command: [--config=/config.yml]
    volumes:
      - ./collector/config.yml:/config.yml
    ports:
      - 4318:4318

  proxy:
    image: saucelabs/forwarder
    environment:
      FORWARDER_PROXY_LOCALHOST: allow
      FORWARDER_LOG_HTTP: url
    ports:
      - 3128:3128

  mysql:
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 3306:3306
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 5432:5432
