name: Images
on:
  push:
    branches:
      - main
    paths:
      - "docker/*.Dockerfile"
      - ".github/workflows/images.yml"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        image:
          - 20-alpine3.20
          - 20-amazonlinux2023
          - 20-debian12
          - 20-ubi8
          - 20-ubuntu22.04
          - 22-alpine
          - 22-amazonlinux
          - 22-debian
          - 22-ubi
          - 22-ubuntu
          - 24-alpine
          - 24-amazonlinux
          - 24-debian
          - 24-ubi
          - 24-ubuntu
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: ${{ contains(matrix.image, 'alpine') && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ghcr.io/${{ github.repository }}/dev:${{ matrix.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
