name: Checks
on:
  - push
  - pull_request
  - workflow_dispatch

permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - run: pnpm install
      - run: pnpm run build -p solarwinds-apm
      - run: pnpm run lint

      - name: COMPATIBILITY.md
        run: git --no-pager diff --exit-code HEAD -- packages/instrumentations/COMPATIBILITY.md

      # load bearing .root file
      # actions/upload-artifact will make the archive root the topmost directory which contains all specified files
      # we can force it to be the root of the repo by including an empty file present at the root
      # see https://github.com/actions/upload-artifact#upload-using-multiple-paths-and-exclusions
      - if: github.event_name != 'push'
        id: outputs
        run: |
          touch .root
          {
            echo 'paths<<EOF'
            pnpm --silent outputs
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            .root
            ${{ steps.outputs.outputs.paths }}
          include-hidden-files: true
          retention-days: 1

  tests:
    if: github.event_name != 'push'
    needs:
      - checks
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        os:
          - ubuntu
          - windows
        node:
          - "22.18.0"
          - 24
          - 26
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: ./
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          standalone: true

      - run: pnpm install --ignore-scripts
        continue-on-error: true
      - run: pnpm run test --excludeTaskDependencies
        env:
          SW_APM_COLLECTOR: ${{ secrets.SW_APM_COLLECTOR }}
          SW_APM_SERVICE_KEY: ${{ secrets.SW_APM_SERVICE_KEY }}

  supports:
    if: github.event_name != 'push'
    needs:
      - checks
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        # Include versions from the most recent until the first unsupported
        include:
          # LTS
          - node: 26
            os: ubuntu
            pass: true
          - node: 24
            os: windows
            pass: true
          - node: 22
            os: ubuntu
            pass: true
          - node: 20
            os: windows
            pass: false
          # Unstable
          - node: 25
            os: ubuntu
            pass: false
          # Sanity check
          - node: 10
            os: ubuntu
            pass: false
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: ./
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - run: rm package.json && rm pnpm-lock.yaml && npm install --no-save node-releases @opentelemetry/api
      - run: node -e "require('assert').ok(${{ !matrix.pass && '!' || '' }} require('./packages/solarwinds-apm/dist/version.cjs'))"
